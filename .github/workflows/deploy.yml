name: Enterprise Production Deploy (Firebase backend)

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  # 1. SECURITY & CODE QUALITY GATES
  security-and-quality:
    name: Security & SAST Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Install Backend Dependencies
        run: |
          cd crm-backend
          npm ci
      # Placeholders for Snyk / SonarQube / TruffleHog logic from previous YAML
      - name: Security Clear
        run: echo "Code clear. Proceeding to deployment."

  # 2. FRONTEND DEPLOYMENT TO CLOUDFLARE PAGES
  # REMOVED 2026-10-14: the "Deploy Landing to Cloudflare Pages" job here used
  # the OpenNext path (NEXT_ON_PAGES=1, deploying .open-next/assets). It could
  # never succeed here — this project is a static export (next.config.mjs has
  # output: 'export', wrangler.toml pages_build_output_dir = "out") and there is
  # no open-next.config.ts, so `npm run build` aborted on every push and the
  # job failed red on every commit.
  #
  # cloudflare-pages.yml is the canonical frontend deploy: same secrets, but it
  # builds the standard static export and uploads `out/` via wrangler-action@v4.
  # Do NOT reintroduce an OpenNext frontend job here.

  # 3. BACKEND DEPLOYMENT TO FIREBASE FUNCTIONS
  deploy-backend-firebase:
    name: Deploy Backend API to Firebase
    needs: security-and-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: crm-backend/package-lock.json
      - name: Install Backend Dependencies
        run: |
          cd crm-backend
          npm ci
      - name: Generate Prisma Client
        run: |
          cd crm-backend
          npx prisma generate
      # Applies committed Prisma migrations. If the target database already
      # contains the schema but has no migration history, `migrate deploy`
      # fails with P3005 ("database schema is not empty"); in that case we
      # baseline the initial migration once and re-run. Any other failure
      # (unset DATABASE_URL, unreachable DB, a real SQL error) fails normally.
      - name: Run Database Migrations
        run: |
          cd crm-backend
          set +e
          OUTPUT=$(npx prisma migrate deploy 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -q "P3005"; then
            echo "::warning::Database schema is not empty (P3005). Baselining 20261014000000_init as applied, then re-running migrate deploy."
            npx prisma migrate resolve --applied 20261014000000_init
            npx prisma migrate deploy
          else
            echo "::error::prisma migrate deploy failed (exit $STATUS) for a non-baseline reason; not attempting to baseline."
            exit "$STATUS"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build TypeScript
        run: |
          cd crm-backend
          npm run build
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Functions
        run: |
          cd crm-backend
          firebase deploy --only functions --project netamps-production --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: 'netamps-production'
          PROJECT_PATH: 'crm-backend'