name: security-scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crm-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: crm-backend
      - run: npx prisma generate
        working-directory: crm-backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db?schema=public

  typecheck-build-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: crm-backend
      - run: npm run typecheck
        working-directory: crm-backend
      - run: npm run build
        working-directory: crm-backend
      - run: npm test
        working-directory: crm-backend
      # NOTE: the 80% coverage Quality Gate is enforced server-side in SonarQube;
      # the unit suite here is the seed — grow it toward the gate before enabling
      # `sonar.qualitygate.wait=true`.

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high
        working-directory: crm-backend

  snyk:
    runs-on: ubuntu-latest
    # Runs only when a SNYK_TOKEN secret exists; otherwise skipped, never red.
    if: ${{ env.SNYK_TOKEN != '' }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: crm-backend
      - uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high --file=crm-backend/package.json

  sonarqube:
    runs-on: ubuntu-latest
    # Runs only when Sonar secrets exist; otherwise skipped, never red.
    if: ${{ env.SONAR_TOKEN != '' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@master
