name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# Single deploy path: GitHub Actions direct-upload is canonical.
# Disable automatic Git builds in Cloudflare Dashboard
# (Pages → netamps-landing → Settings → Builds → Automatic deployments: Off)
# to avoid double deployments racing each other.

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -d out || (echo "ERROR: out/ directory missing after build" && exit 1)
          test -f out/index.html || (echo "ERROR: out/index.html missing after build" && exit 1)
          echo "Build output OK:"
          ls out | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=netamps-landing --branch=main --commit-hash=${{ github.sha }}
