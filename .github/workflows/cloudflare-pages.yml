name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# Single deploy path: GitHub Actions direct-upload is canonical.
# Disable automatic Git builds in Cloudflare Dashboard
# (Pages → netamps-landing → Settings → Builds → Automatic deployments: Off)
# to avoid double deployments racing each other.

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify deploy contract (static export)
        run: |
          grep -q "output: 'export'" next.config.mjs || (echo "ERROR: next.config.mjs must use output: 'export'. Dynamic Next routes are silently dropped by 'pages deploy out'. Put dynamic APIs in functions/ instead." && exit 1)
          grep -q 'pages_build_output_dir = "out"' wrangler.toml || (echo "ERROR: wrangler.toml pages_build_output_dir must be \"out\"" && exit 1)
          test ! -f app/api/status/route.ts || (echo "ERROR: app/api/status/route.ts must not exist (dynamic route breaks static export). Use functions/api/status.js instead." && exit 1)
          echo "Deploy contract OK: static export + out/ + edge APIs in functions/"

      - name: Check Cloudflare secrets present
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing. Add it in GitHub → Settings → Secrets → Actions." && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing. Add it in GitHub → Settings → Secrets → Actions." && exit 1)
          echo "Cloudflare secrets present"

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -d out || (echo "ERROR: out/ directory missing after build" && exit 1)
          test -f out/index.html || (echo "ERROR: out/index.html missing after build" && exit 1)
          echo "Build output OK:"
          ls out | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=netamps-landing --branch=main --commit-hash=${{ github.sha }}
