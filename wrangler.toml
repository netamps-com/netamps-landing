name = "netamps-landing"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# Cloudflare Pages configuration - static export (output: out/)
# Bindings (D1/R2) added per explicit user instruction.
# NOTE 2026-10-08: bindings stripped to isolate a `pages deploy` step failure.
# D1-only config also failed, so D1 is out too until proven otherwise. Dashboard
# bindings remain the preferred path for ALL bindings (D1/KV/R2).

# NOTE (deploy-validated): do NOT add [[kv_namespaces]] or [[queues.*]] sections
# here until the backing resources actually exist in the Cloudflare account.
# Unresolvable IDs (e.g. id = "cache-kv-id") and uncreated queues fail
# `wrangler pages deploy` validation AND the native Pages build (runs 118/119/121
# precedent). Create the resource first (KV namespace / Queue), then declare it.
# Code paths that use CACHE_KV / INTAKE_QUEUE already guard with truthiness checks
# and fall back to direct D1, so removal is runtime-safe.
