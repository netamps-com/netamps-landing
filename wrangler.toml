name = "netamps-landing"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# Cloudflare Pages configuration - static export (output: out/)
# Bindings (D1/R2) added per explicit user instruction.
[[d1_databases]]
binding = "DB"
database_name = "netamps-db"
database_id = "544297c4-e412-4b42-86d0-3c4383d92efa"

[[r2_buckets]]
binding = "QUARANTINE_BUCKET"
bucket_name = "netamps-quarantine"

[[r2_buckets]]
binding = "PRODUCTION_BUCKET"
bucket_name = "netamps-evidence"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "cache-kv-id"

[[queues.producers]]
queue = "intake-processing-queue"
binding = "INTAKE_QUEUE"
