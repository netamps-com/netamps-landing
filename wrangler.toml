name = "netamps-landing"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# Cloudflare Pages configuration - static export (output: out/)
# Bindings (D1/R2) live here per project convention. Dashboard bindings work too,
# but file-declared bindings ship with the deployment (no separate dashboard step).
# NOTE 2026-10-08: the recent red deploys were a stray `}` in
# functions/api/intake/sessions.js breaking the Functions bundle — NOT these
# sections. KEEP this file UTF-8 and keep every referenced resource existing.
[[d1_databases]]
binding = "DB"
database_name = "netamps-db"
database_id = "544297c4-e412-4b42-86d0-3c4383d92efa"

[[r2_buckets]]
binding = "QUARANTINE_BUCKET"
bucket_name = "netamps-quarantine"

[[r2_buckets]]
binding = "PRODUCTION_BUCKET"
bucket_name = "netamps-evidence"

# Workers AI — Llama for Tier-2 product-line normalization (spec D4).
# Account-native: same Cloudflare account as D1/R2, no third-party vendor and no
# API key to store or leak. Consumed by functions/api/normalize/line.js (only
# when the match_meta 'norm_enabled' flag is '1', default OFF) and by the BUY
# typeahead Tier-2 fallback in functions/api/products/suggest.js (only when
# Tier-1 finds nothing). Both callers guard `env.AI` truthiness: a missing
# binding degrades (raw key / Custom-unverified path), never a request failure.
# Model ids are constants at the call sites — update there when Cloudflare
# retires a model. This binding existing costs nothing until used.
[ai]
binding = "AI"

# NOTE: [[kv_namespaces]] / [[queues.*]] stay out until those resources are created
# in the account (the old id = "cache-kv-id" placeholder and the uncreated queue were
# never validated live). Code using CACHE_KV / INTAKE_QUEUE guards with truthiness
# checks and falls back to direct D1, so absence is runtime-safe.
# NORMALIZE_QUEUE is guarded the same way (functions/api/returns.js).
